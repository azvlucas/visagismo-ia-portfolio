# Desenvolvimento local: só Postgres + Redis (apps no host com pnpm).
# Uso: docker compose up -d

services:
  postgres:
    image: postgres:16-alpine
    container_name: visagismo-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: visagismo
      POSTGRES_PASSWORD: visagismo
      POSTGRES_DB: visagismo
    ports:
      - "5432:5432"
    volumes:
      - visagismo_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U visagismo -d visagismo"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: visagismo-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - visagismo_redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  visagismo_pg:
  visagismo_redis:
